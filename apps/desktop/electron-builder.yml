# 打包配置。跑法：pnpm dist（本地只打包不发布）；CI 发版走 pnpm dist:publish
#
# 前置：先跑 pnpm vendor:python 准备随包分发的 Python 运行时，
# 并把 pandoc.exe 放在 vendor/pandoc/ 下（见 vendor/README.md）。

appId: top.frankzhangs.mathteachcopilot
productName: MathTeachCopilot
copyright: MathTeachCopilot

# 发布到 GitHub Releases。作用有两个：
# 1. CI 打 tag 后把安装包传上去（只有 --publish always 那条命令会真的发）
#
#    发不发一律由命令行的 --publish 显式决定，不留给默认值：默认值在 CI 上
#    会被隐式设成 onTagOrDraft，而那条「不是 tag 就跳过」的豁免偏偏把 github
#    排除在外——于是 CI 上不带 tag 跑一次 dist，它照样去建 GitHub publisher，
#    然后报「GH_TOKEN is not set」。本机永远碰不到，因为本机不是 CI。
#    （electron-builder 自己也说这套隐式行为 v27 会移除。）
# 2. 生成 app-update.yml 和 latest.yml——应用内自动更新（src/main/updater.ts）
#    全靠它们。releaseType 必须显式写成 release：默认是 draft，
#    而 draft 里的 latest.yml 老师端拉不到——更新会静默地永远查不到新版。
#    （没有 draft 这个键，草稿与否只由 releaseType 决定；多写一个键
#    electron-builder 会直接拒绝整份配置。）
publish:
  provider: github
  owner: frankz61
  repo: MathTeachCopilot
  releaseType: release

directories:
  output: dist
  buildResources: build

# asar 关掉。
#
# 不是体积考虑（体积不是约束），是可排查性：
#
# 1. SDK 带一个 315 MB 的 claude.exe，塞进 asar 里没法直接执行，得靠
#    asarUnpack 和 Electron 的路径改写。那条链路一旦出问题，报出来的错
#    是「spawn ENOENT」，完全指不到真正的原因。
# 2. 和 vendor/ 的选型同一个理由（见 docs/architecture.md 第五节）：
#    装完就是一个普通目录，坏了能 cd 进去自己跑一遍。
asar: false

files:
  - out/**/*
  - package.json
  - '!**/*.map'
  - '!**/*.ts'

# 这三样不进 app 目录，放 resources/ 下。
# 主进程用 process.resourcesPath 找它们，见 src/main/mcp.ts 和 index.ts。
extraResources:
  - from: ../../vendor
    to: vendor
    filter:
      - '**/*'
      # 准备脚本缓存的 embeddable zip，只是为了重跑时不再下载一次，不该进安装包
      - '!*.zip'
  - from: ../../tools-py
    to: tools-py
    filter:
      - '**/*'
      # .venv 是开发期的虚拟环境，几百兆且完全没用——打包形态走 vendor/python
      - '!.venv/**'
      - '!**/__pycache__/**'
      - '!.pytest_cache/**'
      - '!tests/**'
      # 构建期脚本，装到老师机器上没有意义
      - '!prepare_vendor.py'
      - '!prepare_pandoc.py'
      - '!make_icon.py'
      - '!uv.lock'
  - from: ../../curriculum
    to: curriculum

win:
  # build/ 是 buildResources，electron-builder 会自动认这里的 icon.ico；
  # 写明白一点，免得改目录时静默退回默认的 Electron 图标
  icon: build/icon.ico
  target:
    - nsis
  artifactName: ${productName}-${version}-setup.${ext}

nsis:
  # 给老师一个能选安装位置的常规安装向导，不做静默安装：
  # 学校的机器 C 盘常常很小，而这个包不小
  oneClick: false
  allowToChangeInstallationDirectory: true
  # 装到用户目录，不要求管理员权限——学校机器上老师多半没有管理员账号
  perMachine: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MathTeachCopilot
