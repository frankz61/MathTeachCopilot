; 仓库根的 pytest 配置。
;
; tools-py/pyproject.toml 里已经有一份，但那份只在 pytest 找得到它时才生效——
; 在仓库根直接敲 `pytest` 是找不到的。而不限定收集范围的后果不是「跑不到测试」，
; 是**直接爆栈**：vendor/python/Lib/site-packages 是打包用的随包 Python，
; 十几万个文件，pytest 递归收集进去就崩，报一长串 genitems 帧，
; 看不出和 vendor 有任何关系。
;
; 所以这份配置的作用是：无论从哪儿敲 pytest，都只收 tools-py/tests。
[pytest]
testpaths = tools-py/tests
norecursedirs = .venv vendor node_modules dist out __pycache__ .pytest_cache
